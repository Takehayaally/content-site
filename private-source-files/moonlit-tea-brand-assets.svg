<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320mm" height="180mm" viewBox="0 0 1600 900">
  <title>月蚀茶局品牌图形资产</title>
  <desc>可编辑矢量：月弧、八相、茶令、字标与色板。</desc>
  <defs>
    <style>.cn{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.en{font-family:Arial,sans-serif;letter-spacing:8px}</style>
  </defs>
  <rect width="1600" height="900" fill="#f8f4ea"/>
  <g id="主标志" transform="translate(90 90)">
    <rect width="600" height="310" rx="24" fill="#111318"/>
    <path d="M98 110 A120 120 0 0 1 260 85" fill="none" stroke="#c9cdd2" stroke-width="18"/>
    <path d="M128 142 A84 84 0 0 1 245 125" fill="none" stroke="#5d6269" stroke-width="6"/>
    <text x="95" y="230" class="cn" font-size="68" font-weight="700" fill="#f2efe7" letter-spacing="16">月蚀茶局</text>
    <text x="98" y="276" class="en" font-size="20" fill="#c9cdd2">MOON ECLIPSE TEA</text>
  </g>
  <g id="八相图形" transform="translate(760 90)" fill="none" stroke="#111318" stroke-width="10">
    <circle cx="70" cy="70" r="52"/><path d="M57 21 A52 52 0 0 1 57 119" fill="#f8f4ea"/>
    <circle cx="220" cy="70" r="52"/><path d="M202 21 A52 52 0 0 1 202 119" fill="#f8f4ea"/>
    <circle cx="370" cy="70" r="52"/><path d="M370 18 A52 52 0 0 1 370 122" fill="#f8f4ea"/>
    <circle cx="520" cy="70" r="52" fill="#111318"/>
    <circle cx="70" cy="220" r="52" fill="#111318"/><path d="M82 171 A52 52 0 0 0 82 269" fill="#f8f4ea"/>
    <circle cx="220" cy="220" r="52" fill="#111318"/><path d="M238 171 A52 52 0 0 0 238 269" fill="#f8f4ea"/>
    <circle cx="370" cy="220" r="52" fill="#111318"/><path d="M370 168 A52 52 0 0 0 370 272" fill="#f8f4ea"/>
    <circle cx="520" cy="220" r="52"/>
  </g>
  <g id="茶令" transform="translate(90 500)">
    <polygon points="135,0 250,48 298,163 250,278 135,326 20,278 -28,163 20,48" fill="#b74335" transform="translate(40 0)"/>
    <polygon points="175,46 258,80 292,163 258,246 175,280 92,246 58,163 92,80" fill="none" stroke="#f2c8ad" stroke-width="6"/>
    <text x="175" y="145" text-anchor="middle" class="cn" font-size="52" fill="#f8e7d8" font-weight="700">月蚀</text>
    <text x="175" y="210" text-anchor="middle" class="cn" font-size="52" fill="#f8e7d8" font-weight="700">茶令</text>
  </g>
  <g id="颜色规范" transform="translate(510 520)" class="cn">
    <text x="0" y="0" font-size="30" font-weight="700" fill="#27292d">品牌基础色</text>
    <g transform="translate(0 40)"><rect width="170" height="120" rx="12" fill="#111318"/><text x="16" y="150" font-size="22">墨黑 #111318</text></g>
    <g transform="translate(210 40)"><rect width="170" height="120" rx="12" fill="#f8f4ea" stroke="#d8d2c4"/><text x="16" y="150" font-size="22">瓷白 #F8F4EA</text></g>
    <g transform="translate(420 40)"><rect width="170" height="120" rx="12" fill="#b74335"/><text x="16" y="150" font-size="22">朱砂 #B74335</text></g>
    <g transform="translate(630 40)"><rect width="170" height="120" rx="12" fill="#c9cdd2"/><text x="16" y="150" font-size="22">月银 #C9CDD2</text></g>
    <g transform="translate(840 40)"><rect width="170" height="120" rx="12" fill="#b8792c"/><text x="16" y="150" font-size="22">茶珀 #B8792C</text></g>
  </g>
</svg>
