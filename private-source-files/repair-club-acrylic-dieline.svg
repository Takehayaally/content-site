<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="146mm" height="206mm" viewBox="0 0 1460 2060">
  <title>柚铁亚克力立牌背卡刀模｜概念生产文件</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A38"/>
      <stop offset="1" stop-color="#091820"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#D6E2E3" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- PRINT ARTWORK：成品 140×200 mm，四周 3 mm 出血 -->
  <g id="PRINT_ARTWORK">
    <rect width="1460" height="2060" fill="#E9E3D7"/>
    <rect x="30" y="30" width="1400" height="2000" rx="18" fill="url(#paper)"/>
    <rect x="30" y="30" width="1400" height="2000" rx="18" fill="url(#grid)"/>

    <path d="M30 1710L1430 1190V2030H30Z" fill="#0B202A"/>
    <path d="M30 1900L1430 1380" stroke="#F0A21B" stroke-width="46" opacity="0.96"/>
    <path d="M30 1970L1430 1450" stroke="#C96228" stroke-width="12" opacity="0.72"/>

    <g id="BRAND_HEADER" font-family="Microsoft YaHei, sans-serif">
      <text x="105" y="220" font-size="76" font-weight="700" fill="#F4F0E7">街区修补社</text>
      <text x="108" y="282" font-size="27" letter-spacing="5" fill="#F0A21B">BLOCK REPAIR CLUB</text>
      <path d="M108 326H584" stroke="#F0A21B" stroke-width="8"/>
      <text x="108" y="380" font-size="24" fill="#B7C6C9">原创角色周边｜亚克力立牌背卡</text>
    </g>

    <g id="CHARACTER_ART" filter="url(#softShadow)">
      <image x="365" y="300" width="730" height="1460"
             preserveAspectRatio="xMidYMid meet"
             xlink:href="柚铁角色立绘透明底.png"/>
    </g>

    <g id="PRODUCT_INFO" font-family="Microsoft YaHei, sans-serif">
      <rect x="100" y="1585" width="1260" height="350" rx="28" fill="#07151C" fill-opacity="0.82"
            stroke="#3F5C66" stroke-width="3"/>
      <text x="150" y="1688" font-size="70" font-weight="700" fill="#F4F0E7">柚铁</text>
      <text x="153" y="1740" font-size="28" letter-spacing="4" fill="#F0A21B">YOUTIE / REPAIR CREW 07</text>
      <text x="153" y="1815" font-size="25" fill="#C2CED0">角色立牌建议高度 150 mm｜透明亚克力 3 mm</text>
      <text x="153" y="1863" font-size="25" fill="#C2CED0">背卡成品 140 × 200 mm｜预留挂孔与封袋区域</text>
      <text x="153" y="1911" font-size="21" fill="#E07A3A">概念生产文件｜未打样｜交付供应商前需转曲、校色并复核刀模</text>
    </g>
  </g>

  <!-- SAFE LINE：绿色虚线，仅校稿，不参与印刷 -->
  <g id="SAFE_LINE" fill="none" stroke="#00A66A" stroke-width="4" stroke-dasharray="18 12">
    <rect x="80" y="80" width="1300" height="1900" rx="12"/>
  </g>

  <!-- CUT LINE：洋红专色刀线，供应商定稿前需按真实刀版替换 -->
  <g id="CUT_LINE" fill="none" stroke="#FF00A8" stroke-width="5">
    <rect x="30" y="30" width="1400" height="2000" rx="18"/>
    <rect x="610" y="86" width="240" height="70" rx="35"/>
  </g>

  <!-- NOTES：工作说明，不参与成品画面 -->
  <g id="NOTES" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#171717">
    <text x="50" y="2050">洋红：刀线｜绿色虚线：安全线｜画板含 3 mm 出血</text>
  </g>
</svg>
