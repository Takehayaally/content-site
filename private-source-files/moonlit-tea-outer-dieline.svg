<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="300mm" viewBox="0 0 420 300">
  <title>月相茶包礼册外壳刀模</title>
  <desc>成品单面170×240mm，书脊28mm，四周4mm出血。洋红实线为刀线，青色虚线为折线，绿色虚线为安全线。</desc>
  <defs>
    <style>
      .note{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#27292d;font-size:4px}
      .small{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#d9d7cf;font-size:3.5px;letter-spacing:.7px}
      .cut{fill:none;stroke:#ff00b7;stroke-width:.55}
      .fold{fill:none;stroke:#00b7d6;stroke-width:.45;stroke-dasharray:4 2}
      .safe{fill:none;stroke:#38a65a;stroke-width:.35;stroke-dasharray:3 2}
      .silver{fill:none;stroke:#c9cdd2;stroke-width:1.25}
    </style>
  </defs>
  <rect width="420" height="300" fill="#f8f4ea"/>
  <g id="说明层">
    <text x="22" y="14" class="note" style="font-size:6px;font-weight:700">月相茶包礼册｜外壳展开刀模</text>
    <text x="22" y="20" class="note">成品：170×240×28mm　出血：4mm　建议纸材：1200g 灰板裱 157g 特种纸</text>
    <line x1="283" y1="15" x2="295" y2="15" class="cut"/><text x="298" y="16.5" class="note">刀线</text>
    <line x1="326" y1="15" x2="338" y2="15" class="fold"/><text x="341" y="16.5" class="note">折线</text>
    <line x1="369" y1="15" x2="381" y2="15" class="safe"/><text x="384" y="16.5" class="note">安全线</text>
  </g>
  <g id="出血与画面层">
    <rect x="22" y="22" width="376" height="256" rx="1" fill="#111318"/>
    <rect x="22" y="22" width="4" height="256" fill="#b74335"/>
    <path d="M46 58 A64 64 0 0 1 116 35" class="silver" opacity=".9"/>
    <path d="M56 70 A48 48 0 0 1 110 48" class="silver" opacity=".35"/>
    <path d="M299 231 A70 70 0 0 1 371 254" class="silver" opacity=".9"/>
    <path d="M312 218 A52 52 0 0 1 367 236" class="silver" opacity=".35"/>
    <rect x="196" y="22" width="28" height="256" fill="#0b0d11"/>
    <line x1="210" y1="43" x2="210" y2="257" stroke="#b74335" stroke-width="1"/>
    <g id="背封画面">
      <circle cx="109" cy="140" r="39" fill="none" stroke="#c9cdd2" stroke-width="1.5"/>
      <circle cx="121" cy="133" r="39" fill="#111318"/>
      <polygon points="109,126 122,134 117,149 101,149 96,134" fill="#b74335"/>
      <text x="109" y="198" text-anchor="middle" class="small">EIGHT PHASES · SIX AROMAS</text>
      <text x="109" y="207" text-anchor="middle" class="small" style="font-size:3px;opacity:.72">夜航茶香档案 / 6 枚独立茶包</text>
    </g>
    <g id="书脊画面">
      <text x="210" y="146" text-anchor="middle" class="small" transform="rotate(-90 210 146)" style="font-size:5px;letter-spacing:1.5px">月蚀茶局　MOON ECLIPSE TEA</text>
    </g>
    <g id="正封画面">
      <path d="M280 79 A69 69 0 0 1 365 92" class="silver"/>
      <path d="M293 92 A53 53 0 0 1 360 103" class="silver" opacity=".35"/>
      <text x="309" y="142" class="small" style="font-size:11px;font-weight:700;letter-spacing:4px;fill:#f2efe7">月蚀茶局</text>
      <text x="311" y="154" class="small" style="font-size:4px;letter-spacing:1.9px">MOON ECLIPSE TEA ATLAS</text>
      <polygon points="344,183 355,189 351,202 337,202 333,189" fill="#b74335"/>
      <text x="344" y="194" text-anchor="middle" class="small" style="font-size:3px;fill:#f7e6d4">茶令</text>
    </g>
  </g>
  <g id="刀模层">
    <rect x="26" y="26" width="368" height="248" rx="1" class="cut"/>
    <line x1="196" y1="26" x2="196" y2="274" class="fold"/>
    <line x1="224" y1="26" x2="224" y2="274" class="fold"/>
  </g>
  <g id="安全线层">
    <rect x="32" y="32" width="158" height="236" class="safe"/>
    <rect x="202" y="32" width="16" height="236" class="safe"/>
    <rect x="230" y="32" width="158" height="236" class="safe"/>
  </g>
  <g id="尺寸标注层" class="note">
    <line x1="26" y1="286" x2="196" y2="286" stroke="#555" stroke-width=".3"/><text x="111" y="294" text-anchor="middle">背封 170mm</text>
    <line x1="196" y1="286" x2="224" y2="286" stroke="#555" stroke-width=".3"/><text x="210" y="294" text-anchor="middle">28</text>
    <line x1="224" y1="286" x2="394" y2="286" stroke="#555" stroke-width=".3"/><text x="309" y="294" text-anchor="middle">正封 170mm</text>
  </g>
</svg>
