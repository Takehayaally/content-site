<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="180mm" viewBox="0 0 160 180">
  <title>月相茶包独立信封刀模</title>
  <desc>成品80×110mm，上舌25mm，下舌20mm，左右糊口18mm，四周3mm出血。</desc>
  <defs>
    <style>
      .t{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#24262a;font-size:3.5px}
      .cut{fill:none;stroke:#ff00b7;stroke-width:.5}
      .fold{fill:none;stroke:#00b7d6;stroke-width:.4;stroke-dasharray:3 2}
      .safe{fill:none;stroke:#38a65a;stroke-width:.3;stroke-dasharray:2 1.5}
      .silver{fill:none;stroke:#c9cdd2;stroke-width:1}
    </style>
  </defs>
  <rect width="160" height="180" fill="#f8f4ea"/>
  <text x="12" y="12" class="t" style="font-size:5px;font-weight:700">月相茶包｜单枚信封刀模</text>
  <text x="12" y="18" class="t">成品80×110mm　出血3mm　建议食品接触内袋另封</text>
  <g id="画面层">
    <rect x="37" y="42" width="86" height="116" fill="#111318"/>
    <path d="M52 62 A42 42 0 0 1 103 52" class="silver"/>
    <path d="M60 71 A32 32 0 0 1 101 62" class="silver" opacity=".35"/>
    <polygon points="93,109 103,115 99,127 87,127 83,115" fill="#b74335"/>
    <text x="50" y="111" class="t" style="fill:#f2efe7;font-size:7px;font-weight:700;letter-spacing:2px">桥影</text>
    <text x="50" y="119" class="t" style="fill:#c9cdd2;font-size:3px;letter-spacing:.7px">ROASTED ROCK TEA</text>
  </g>
  <g id="刀模层">
    <path d="M40 45 L58 25 Q80 18 102 25 L120 45 L138 57 L120 75 L120 155 L106 172 L54 172 L40 155 L40 75 L22 57 Z" class="cut"/>
  </g>
  <g id="折线层">
    <line x1="40" y1="45" x2="120" y2="45" class="fold"/>
    <line x1="40" y1="75" x2="120" y2="75" class="fold"/>
    <line x1="40" y1="155" x2="120" y2="155" class="fold"/>
    <line x1="40" y1="45" x2="40" y2="155" class="fold"/>
    <line x1="120" y1="45" x2="120" y2="155" class="fold"/>
  </g>
  <g id="安全线层"><rect x="46" y="81" width="68" height="68" class="safe"/></g>
  <g id="说明层" class="t">
    <text x="126" y="92">右糊口</text><text x="7" y="92">左糊口</text>
    <text x="73" y="30">上舌</text><text x="72" y="168">下舌</text>
  </g>
</svg>
